# Pages CMS configuration — https://pagescms.org
# Connect this repo at https://app.pagescms.org to edit all site text in a form.
content:
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - { name: hero_line1, label: Hero headline — line 1, type: string }
      - { name: hero_line2, label: Hero headline — line 2 (italic), type: string }
      - { name: lede, label: Intro paragraph, type: text }
      - { name: bone_caption, label: Caption under the 3D bone, type: string }
      - { name: involve_heading, label: "Get involved — heading", type: string }
      - { name: involve1_title, label: "Get involved — card 1 title", type: string }
      - { name: involve1_desc, label: "Get involved — card 1 text", type: text }
      - { name: involve2_title, label: "Get involved — card 2 title", type: string }
      - { name: involve2_desc, label: "Get involved — card 2 text", type: text }
  - name: research
    label: Research
    type: file
    path: content/research.json
    fields:
      - { name: page_title, label: Page title, type: string }
      - { name: a1_title, label: Physical AI category, type: string }
      - { name: a1_text, label: Category 1 description, type: text }
      - { name: a2_title, label: Biomechanics category, type: string }
      - { name: a2_text, label: Category 2 description, type: text }
      - { name: a3_title, label: Gluteus medius category, type: string }
      - { name: a3_text, label: Category 3 description, type: text }
      - { name: a4_title, label: Population evidence category, type: string }
      - { name: a4_text, label: Category 4 description, type: text }

  - name: publications
    label: Publications
    type: file
    path: content/publications.json
    fields:
      - { name: page_title, label: Page title, type: string }
      - { name: page_intro, label: Page intro, type: text }
      - name: selected_publication_links
        label: "Selected publication URLs (display order)"
        type: string
        list: true
      - name: publications
        label: "Full bibliography (newest first)"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: text }
          - { name: authors, label: Authors, type: string }
          - { name: meta, label: "Venue line (journal · year)", type: string }
          - { name: link, label: "Link (DOI or URL)", type: string }

  - name: people
    label: People
    type: file
    path: content/people.json
    fields:
      - { name: page_title, label: Page title, type: string }
      - { name: page_intro, label: Page intro, type: text }
      - { name: pi_name, label: "PI — name", type: string }
      - { name: pi_role, label: "PI — title block (one per line)", type: text }
      - { name: pi_photo, label: "PI — photo (square; leave empty for initials)", type: image, media: images }
      - { name: pi_bio1, label: "PI — bio paragraph 1", type: text }
      - { name: pi_bio2, label: "PI — bio paragraph 2", type: text }
      - { name: pi_bio3, label: "PI — bio paragraph 3", type: text }
      - { name: pi_honors, label: "PI — selected honors (one per line)", type: text }
      - { name: leadership_heading, label: "Leadership — heading", type: string }
      - name: leadership
        label: Leadership
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }
          - { name: photo, label: "Photo (square; leave empty for initials)", type: image, media: images }
      - { name: projects_heading, label: "Research team — heading", type: string }
      - name: project_team
        label: Research team
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Role, type: string }
          - { name: photo, label: "Photo (square; leave empty for initials)", type: image, media: images }
      - { name: alumni_heading, label: "Alumni — heading", type: string }
      - name: alumni
        label: Alumni
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: "Current role (residency, institution)", type: string }
  - name: partnerships
    label: Partnerships
    type: file
    path: content/partnerships.json
    fields:
      - { name: page_title, label: Page title, type: string }
      - { name: page_intro, label: Page intro, type: text }
      - { name: worked_heading, label: "Who we've worked with — heading", type: string }
      - { name: google_role, label: "Google — role", type: string }
      - { name: conmed_role, label: "ConMed — role", type: string }
      - { name: zimmer_role, label: "Zimmer Biomet — role", type: string }
      - { name: tensor_role, label: "The Tensor Lab — role", type: string }
      - { name: models_heading, label: "Partnership models — heading", type: string }
      - { name: model1_tag, label: "Model 1 — tag", type: string }
      - { name: model1_title, label: "Model 1 — title", type: string }
      - { name: model1_desc, label: "Model 1 — description", type: text }
      - { name: model2_tag, label: "Model 2 — tag", type: string }
      - { name: model2_title, label: "Model 2 — title", type: string }
      - { name: model2_desc, label: "Model 2 — description", type: text }
      - { name: model3_tag, label: "Model 3 — tag", type: string }
      - { name: model3_title, label: "Model 3 — title", type: string }
      - { name: model3_desc, label: "Model 3 — description", type: text }
      - { name: cta_heading, label: "Contact — heading", type: string }
      - { name: cta_text, label: "Contact — text", type: text }
      - { name: cta_button, label: "Contact — button label", type: string }

  - name: join
    label: Join
    type: file
    path: content/join.json
    fields:
      - { name: page_title, label: Page title, type: string }
      - { name: page_intro, label: Page intro, type: text }
      - { name: openings_heading, label: "Open positions — heading", type: string }
      - name: openings
        label: "Open positions (clear when filled)"
        type: object
        list: true
        fields:
          - { name: tag, label: "Tag (e.g. UCSF · Paid)", type: string }
          - { name: title, label: "Position title", type: string }
          - { name: detail, label: "Description", type: text }
          - { name: cta, label: "Button label", type: string }
          - { name: link, label: "Link to posting", type: string }
      - { name: recruit_heading, label: "Who can apply — heading", type: string }
      - { name: level1_title, label: "Level 1 — title", type: string }
      - { name: level1_desc, label: "Level 1 — description", type: text }
      - { name: level2_title, label: "Level 2 — title", type: string }
      - { name: level2_desc, label: "Level 2 — description", type: text }
      - { name: level3_title, label: "Level 3 — title", type: string }
      - { name: level3_desc, label: "Level 3 — description", type: text }
      - { name: level4_title, label: "Level 4 — title", type: string }
      - { name: level4_desc, label: "Level 4 — description", type: text }
      - { name: apply_heading, label: "How to apply — heading", type: string }
      - { name: apply_text, label: "How to apply — text", type: text }
      - { name: apply_form_button, label: "Application button label", type: string }

# Image uploads (member and PI photos). The CMS saves uploads into /images and
# stores their path in the photo fields above.
media:
  name: images
  label: Images
  input: images
  output: /images
  extensions: [png, jpg, jpeg, webp, gif, svg]
  categories: [image]
